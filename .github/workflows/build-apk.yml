name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK for Web Download
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/release/app-release.apk public/dna-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNA-AI-Android-APK
          path: public/dna-ai.apk

      - name: Commit and Push Updated APK to Web
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dna-ai.apk
          git diff-index --quiet HEAD || git commit -m "chore(apk): update public/dna-ai.apk build [skip ci]"
          git push origin main || echo "No changes to push"
